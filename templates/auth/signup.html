{% extends 'base.html' %}
{% block title %}Sign Up - Saffron Feast{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; margin-top: 20px;">
  <div class="receipt-card" style="padding: 30px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 1.8rem; color: var(--secondary); margin-bottom: 6px;">Create Customer Account</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Join us for exclusive discounts, order tracking, and table booking</p>
    </div>

    <form action="{{ url_for('signup') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. john@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="e.g. 9876543210">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px; font-size: 1.05rem;">
        Register & Continue
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? 
      <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
